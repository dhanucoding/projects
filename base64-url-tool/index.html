<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 / URL Encoder-Decoder</title>
<style>
  :root {
    --bg: #f6f3ee;
    --panel: #ffffff;
    --panel-border: rgba(126, 99, 75, 0.16);
    --text: #2d241e;
    --muted: #6d625a;
    --accent: #ba6f3b;
    --accent-soft: #f2d6bd;
    --error: #b9433f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 28px;
    background: var(--bg);
    color: var(--text);
    font-family: "Avenir Next", "Trebuchet MS", sans-serif;
  }

  .shell { max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  header a { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
  header a:hover { color: var(--accent); }
  h1 { margin: 10px 0 4px; font-size: 1.6rem; }
  header p { color: var(--muted); margin: 0; font-size: 0.92rem; }

  .tabs {
    display: flex;
    gap: 8px;
    margin: 22px 0 16px;
    flex-wrap: wrap;
  }

  .tab {
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff8f1;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 20px;
  }

  .mode-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }

  .mode-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
  }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 680px) {
    .columns { grid-template-columns: 1fr; }
  }

  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
  }

  textarea {
    width: 100%;
    height: 220px;
    resize: vertical;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: #fffdfb;
    color: var(--text);
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.92rem;
    line-height: 1.5;
  }

  textarea:focus { outline: 2px solid var(--accent-soft); }

  .field-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .copy-btn {
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #fff;
    color: var(--muted);
    font-size: 0.78rem;
    cursor: pointer;
  }

  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  .error {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    background: #fbe9e8;
    color: var(--error);
    font-size: 0.85rem;
    display: none;
  }

  .error.show { display: block; }
</style>
</head>
<body>
  <main class="shell">
    <header>
      <a href="../index.html">&larr; Back to hub</a>
      <h1>Base64 / URL Encoder-Decoder</h1>
      <p>Two-way live conversion, entirely in your browser.</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-type="base64">Base64</button>
      <button class="tab" data-type="url">URL Component</button>
    </div>

    <section class="panel">
      <div class="mode-row">
        <label><input type="radio" name="dir" value="encode" checked> Encode (text &rarr; encoded)</label>
        <label><input type="radio" name="dir" value="decode"> Decode (encoded &rarr; text)</label>
      </div>

      <div class="columns">
        <div class="field">
          <div class="field-head">
            <label id="leftLabel" for="leftArea">Text</label>
            <button class="copy-btn" data-target="leftArea">Copy</button>
          </div>
          <textarea id="leftArea" spellcheck="false" placeholder="Type or paste here..."></textarea>
        </div>
        <div class="field">
          <div class="field-head">
            <label id="rightLabel" for="rightArea">Encoded</label>
            <button class="copy-btn" data-target="rightArea">Copy</button>
          </div>
          <textarea id="rightArea" spellcheck="false" placeholder="Result appears here..."></textarea>
        </div>
      </div>

      <div class="error" id="errorBox"></div>
    </section>
  </main>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const dirRadios = document.querySelectorAll('input[name="dir"]');
    const leftArea = document.getElementById('leftArea');
    const rightArea = document.getElementById('rightArea');
    const leftLabel = document.getElementById('leftLabel');
    const rightLabel = document.getElementById('rightLabel');
    const errorBox = document.getElementById('errorBox');

    let type = 'base64';
    let dir = 'encode';
    let activeSide = 'left';

    function encodeBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin);
    }

    function decodeBase64(str) {
      const bin = atob(str);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    }

    function encodeUrl(str) {
      return encodeURIComponent(str);
    }

    function decodeUrl(str) {
      return decodeURIComponent(str);
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('show');
    }

    function updateLabels() {
      if (dir === 'encode') {
        leftLabel.textContent = 'Text';
        rightLabel.textContent = type === 'base64' ? 'Base64' : 'URL-encoded';
      } else {
        leftLabel.textContent = type === 'base64' ? 'Base64' : 'URL-encoded';
        rightLabel.textContent = 'Text';
      }
    }

    function convert(fromRight) {
      clearError();
      const source = fromRight ? rightArea : leftArea;
      const target = fromRight ? leftArea : rightArea;
      const input = source.value;

      if (input === '') {
        target.value = '';
        return;
      }

      const forwardIsEncode = (dir === 'encode') !== fromRight;

      try {
        let result;
        if (type === 'base64') {
          result = forwardIsEncode ? encodeBase64(input) : decodeBase64(input);
        } else {
          result = forwardIsEncode ? encodeUrl(input) : decodeUrl(input);
        }
        target.value = result;
      } catch (e) {
        showError('Could not ' + (forwardIsEncode ? 'encode' : 'decode') + ' input: ' + e.message);
      }
    }

    leftArea.addEventListener('input', () => { activeSide = 'left'; convert(false); });
    rightArea.addEventListener('input', () => { activeSide = 'right'; convert(true); });

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        type = tab.dataset.type;
        updateLabels();
        clearError();
        convert(activeSide === 'right');
      });
    });

    dirRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        dir = document.querySelector('input[name="dir"]:checked').value;
        updateLabels();
        clearError();
        convert(activeSide === 'right');
      });
    });

    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        target.select();
        navigator.clipboard.writeText(target.value).catch(() => {
          document.execCommand('copy');
        });
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = original, 1200);
      });
    });

    updateLabels();
  </script>
</body>
</html>
