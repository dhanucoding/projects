<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects Hub</title>
<style>
  :root {
    --bg: #f6f3ee;
    --panel: rgba(255, 255, 255, 0.82);
    --panel-border: rgba(126, 99, 75, 0.16);
    --text: #2d241e;
    --muted: #6d625a;
    --accent: #ba6f3b;
    --accent-soft: #f2d6bd;
    --blue: #bcdcff;
    --purple: #dccbf0;
    --green: #bde8c3;
    --gray: #d4d7dc;
    --shadow: 0 20px 60px rgba(77, 53, 36, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    padding: 32px;
    color: var(--text);
    font-family: "Avenir Next", "Trebuchet MS", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(245, 209, 175, 0.75), transparent 28%),
      radial-gradient(circle at 85% 20%, rgba(196, 213, 255, 0.7), transparent 24%),
      linear-gradient(180deg, #fbfaf7 0%, var(--bg) 100%);
  }

  .shell {
    max-width: 1100px;
    margin: 0 auto;
  }

  .hero {
    position: relative;
    overflow: hidden;
    padding: 38px;
    border: 1px solid var(--panel-border);
    border-radius: 28px;
    background: var(--panel);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }

  .hero::after {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    right: -60px;
    top: -70px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(186, 111, 59, 0.18), rgba(220, 203, 240, 0.4));
  }

  .eyebrow {
    display: inline-block;
    margin-bottom: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    background: #fff4ea;
    color: var(--accent);
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  h1 {
    max-width: 700px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.4rem, 5vw, 4.5rem);
    line-height: 0.95;
    letter-spacing: -0.04em;
  }

  .intro {
    max-width: 680px;
    margin-top: 16px;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.7;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 28px 4px 8px;
  }

  .toolbar h2 { font-size: 1.2rem; letter-spacing: 0.02em; }
  .toolbar p { color: var(--muted); font-size: 0.92rem; }

  .search {
    width: min(320px, 100%);
    padding: 10px 16px;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.9);
    color: var(--text);
    font: inherit;
    font-size: 0.92rem;
  }

  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .category { margin-top: 26px; }

  .category h3 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 4px 12px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .category h3 span { color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 18px;
    text-decoration: none;
    color: inherit;
    border-radius: 20px;
    border: 1px solid var(--panel-border);
    background: rgba(255, 255, 255, 0.84);
    box-shadow: 0 10px 26px rgba(77, 53, 36, 0.07);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 16px 34px rgba(77, 53, 36, 0.13);
    outline: none;
  }

  .card-featured {
    grid-column: span 2;
    border-color: var(--purple);
    background: linear-gradient(135deg, rgba(243, 231, 255, 0.7), rgba(255, 255, 255, 0.9));
  }

  .icon {
    display: inline-flex;
    width: 40px;
    height: 40px;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: #fff4ea;
    font-size: 1.25rem;
  }

  .card h4 { font-size: 1.05rem; line-height: 1.2; }

  .card p {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.5;
  }

  .empty { margin: 28px 4px; color: var(--muted); }

  [hidden] { display: none !important; }

  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 520px) {
    body { padding: 18px; }
    .hero { padding: 24px; border-radius: 22px; }
    .grid { grid-template-columns: 1fr; }
    .card-featured { grid-column: auto; }
    .toolbar { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <span class="eyebrow">Projects Hub</span>
      <h1>Small apps, one clean entry point.</h1>
      <p class="intro">
        Browser-based tools and boards that run entirely on your device. Pick one below, or search to jump straight to it.
      </p>
    </section>

    <div class="toolbar">
      <div>
        <h2>Available Apps</h2>
        <p id="count">Published directly from GitHub Pages.</p>
      </div>
      <input id="search" class="search" type="search" placeholder="Search apps…" aria-label="Search apps" autocomplete="off">
    </div>

    <div id="apps"></div>
    <p id="empty" class="empty" hidden>No apps match your search.</p>
    <noscript><p class="empty">This page needs JavaScript to list the apps.</p></noscript>
  </main>

<script>
// To add an app: append one entry to APPS (keep entries grouped by category).
// Categories render in CATEGORIES order; an app whose cat isn't listed there is not shown.
var CATEGORIES = ['Boards', 'Text & Code', 'Converters', 'Generators'];
var APPS = [
  { cat: 'Boards', icon: '🗂️', title: 'Kanban Board', featured: true, href: './kanban/index.html',
    desc: 'The primary board. Uses IndexedDB for reliable, persistent local storage.' },
  { cat: 'Boards', icon: '📋', title: 'Kanban Local', href: './kanban/kanban-local.html',
    desc: 'A simpler localStorage-based version of the same board.' },

  { cat: 'Text & Code', icon: '{ }', title: 'JSON Formatter', href: './jsonFormatter/index.html',
    desc: 'Format, inspect, and work with JSON in a focused utility.' },
  { cat: 'Text & Code', icon: '📝', title: 'Markdown Previewer', href: './markdown-previewer/index.html',
    desc: 'Paste Markdown, see a live-rendered preview and copy the generated HTML.' },
  { cat: 'Text & Code', icon: '.*', title: 'Regex Tester', href: './regex-tester/index.html',
    desc: 'Test a regex against sample text with live match highlighting and group breakdown.' },
  { cat: 'Text & Code', icon: '±', title: 'Text Diff Checker', href: './diff-checker/index.html',
    desc: 'Compare two blocks of text and highlight line- and word-level differences.' },
  { cat: 'Text & Code', icon: '🔤', title: 'Base64 / URL Encoder-Decoder', href: './base64-url-tool/index.html',
    desc: 'Encode or decode text as Base64 or URI components.' },

  { cat: 'Converters', icon: '🎨', title: 'Color Converter & Contrast Checker', href: './color-tools/index.html',
    desc: 'Convert between HEX/RGB/HSL and check WCAG contrast ratios for a foreground/background pair.' },
  { cat: 'Converters', icon: '📏', title: 'Unit Converter', href: './unit-converter/index.html',
    desc: 'Convert length, weight, temperature, and volume between common units.' },

  { cat: 'Generators', icon: '🔐', title: 'Password Generator & Strength Checker', href: './password-generator/index.html',
    desc: 'Generate strong random passwords and estimate the strength of a typed one.' },
  { cat: 'Generators', icon: '🆔', title: 'UUID Generator', href: './uuid-generator/index.html',
    desc: 'Generate v4 (random) and v7 (time-ordered) UUIDs in bulk.' }
];

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function cardFor(app) {
  var a = el('a', 'card' + (app.featured ? ' card-featured' : ''));
  a.href = app.href;
  a.appendChild(el('span', 'icon', app.icon));
  a.appendChild(el('h4', '', app.title));
  a.appendChild(el('p', '', app.desc));
  return a;
}

function render(query) {
  var q = (query || '').trim().toLowerCase();
  var root = document.getElementById('apps');
  root.textContent = '';
  var total = 0;
  CATEGORIES.forEach(function (cat) {
    var matches = APPS.filter(function (app) {
      return app.cat === cat && (!q || (app.title + ' ' + app.desc).toLowerCase().indexOf(q) !== -1);
    });
    if (!matches.length) return;
    total += matches.length;
    var section = el('section', 'category');
    var h = el('h3', '', cat);
    h.appendChild(el('span', '', String(matches.length)));
    section.appendChild(h);
    var grid = el('div', 'grid');
    matches.forEach(function (app) { grid.appendChild(cardFor(app)); });
    section.appendChild(grid);
    root.appendChild(section);
  });
  document.getElementById('empty').hidden = total !== 0;
  document.getElementById('count').textContent = q
    ? total + ' of ' + APPS.length + ' apps'
    : APPS.length + ' apps, published directly from GitHub Pages.';
}

document.getElementById('search').addEventListener('input', function (e) { render(e.target.value); });
render('');
</script>
</body>
</html>
